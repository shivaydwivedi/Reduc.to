name: Feature request
description: Propose a scoped product or engineering improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Product
        - API
        - Web
        - Analytics
        - Security/privacy
        - Documentation
        - Infrastructure
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Include exclusions, risks, or dependencies.
